<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{% block title %}自测台{% endblock %}</title>
  <style>
    body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; background: #f4f6f8; margin: 0; color: #1c2430; }
    header { background: #1f4e79; color: #fff; padding: 14px 24px; }
    header a { color: #fff; margin-right: 16px; }
    main { max-width: 980px; margin: 24px auto 48px; background: #fff; padding: 24px 28px; border: 1px solid #d9e0e7; }
    h1 { font-size: 22px; margin-top: 0; }
    label { display: block; margin: 12px 0 4px; }
    input[type="text"], input[type="file"], textarea { width: 100%; box-sizing: border-box; padding: 8px; font-size: 15px; }
    button, .btn { background: #1f4e79; color: #fff; border: 0; padding: 8px 16px; font-size: 15px; cursor: pointer; text-decoration: none; display: inline-block; }
    .err { color: #a32020; }
    .ok { color: #1d6b3a; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    th, td { border: 1px solid #d9e0e7; padding: 8px; vertical-align: top; text-align: left; }
    th { background: #eef3f8; }
    .bad { color: #a32020; font-weight: 700; }
    pre { background: #f7f9fb; padding: 12px; overflow: auto; white-space: pre-wrap; }
    .check { margin-right: 16px; }
  </style>
</head>
<body>
  <header>
    <strong>自测台</strong>
    <a href="/">材料</a>
    <a href="/plan">计划</a>
    <a href="/result">结果</a>
    <a href="/report">报告</a>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
