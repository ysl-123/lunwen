<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>丙档业务系统 · 登录</title>
  <style>
    body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; background: #f4f6f8; margin: 0; }
    main { max-width: 420px; margin: 64px auto; background: #fff; padding: 28px 32px; border: 1px solid #d9e0e7; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #445; line-height: 1.5; }
    label { display: block; margin: 14px 0 6px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 16px; }
    button { margin-top: 18px; background: #1f4e79; color: #fff; border: 0; padding: 8px 18px; font-size: 16px; cursor: pointer; }
    .err { color: #a32020; }
    code { background: #f0f3f6; padding: 0 4px; }
  </style>
</head>
<body>
  <main>
    <h1>{{ grade }}档业务系统</h1>
    <p>演示登录。账号 test，口令 123456。丙档是明文 HTTP，乙档是普通 HTTPS。</p>
    <p>演示账号 <code>test</code>，口令 <code>123456</code></p>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <p><a href="/download">下载本次材料</a></p>
    <form method="post" action="/login">
      <label for="username">账号</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">口令</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">登录</button>
    </form>
  </main>
</body>
</html>
