<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>丙档业务系统 · 资料</title>
  <style>
    body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; background: #f4f6f8; margin: 0; }
    main { max-width: 560px; margin: 64px auto; background: #fff; padding: 28px 32px; border: 1px solid #d9e0e7; }
    h1 { font-size: 22px; margin-top: 0; }
    dt { color: #556; margin-top: 12px; }
    dd { margin: 4px 0 0; font-size: 20px; }
    button { margin-top: 24px; background: #1f4e79; color: #fff; border: 0; padding: 8px 18px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>资料页</h1>
    <p>已登录。当前档为 {{ grade }}。</p>
    <dl>
      <dt>账号</dt>
      <dd>{{ username }}</dd>
      <dt>手机号</dt>
      <dd id="phone">{{ phone }}</dd>
    </dl>
    <p><a href="/download">下载本次材料</a></p>
    <form method="post" action="/logout">
      <button type="submit">退出</button>
    </form>
  </main>
</body>
</html>
